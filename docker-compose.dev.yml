services:
  django:
    volumes:
      - ./src/app:/srv/src/app
      - dbs-data:/data/dbs
      - static-data:/srv/src/app/static

  celery-beat:
    volumes:
      - ./src/app:/srv/src/app
      - dbs-data:/data/dbs

  check:
    volumes:
      - ./src/app:/srv/src/app
      - dbs-data:/data/dbs     

  download:
    volumes:
      - ./src/app:/srv/src/app
      - dbs-data:/data/dbs:rw
