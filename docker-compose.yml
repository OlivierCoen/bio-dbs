services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: src/app/Dockerfile
    env_file: .env
    entrypoint: ["./entrypoint.sh"]
    volumes:
      - dbs-data:/data/dbs
      - static-data:/srv/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: src/app/Dockerfile
    env_file: .env
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - dbs-data:/data/dbs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # IMPORTANT: beat must stay a singleton (one container only)

  flower:
    build:
      context: .
      dockerfile: src/app/Dockerfile
    env_file: .env
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  check:
    build:
      context: .
      dockerfile: src/runner/Dockerfile
    env_file: .env
    command: celery -A config worker -Q check -l info --concurrency 2
    volumes:
      - dbs-data:/data/dbs     # same volume as django/runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  download:
    build:
      context: .
      dockerfile: src/runner/Dockerfile
    env_file: .env
    command: celery -A config worker -Q download -l info --concurrency 3
    volumes:
      - dbs-data:/data/dbs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  static-data:
  dbs-data: