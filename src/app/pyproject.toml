[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Olivier", email = "coen.olivier@gmail.com" }
]
requires-python = "==3.14.9"
dependencies = [
    "bio-dbs-modules",
    "django==6.0.9",
    "celery[redis]==5.6.3",
    "flower==2.2.0",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "redis==6.4.0",
    "gunicorn==26.2.0",
    "psycopg2-binary==2.9.13",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "databases"]
