[project]
name = "bio-dbs"
version = "0.1.0"
requires-python = "==3.14.9"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Olivier", email = "coen.olivier@gmail.com" }
]

dependencies = [
    "django==6.0.9",
    "celery[redis]==5.6.3",
    "flower==2.2.0",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "redis==6.4.0",
    "gunicorn==26.2.0",
    "psycopg2-binary==2.9.13",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "whitenoise>=6.12.0",
    "beautifulsoup4==4.15.0"
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4",
    "django-debug-toolbar>=4.4",
    "fakeredis[lua]>=2.40.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src/app"]        # makes `config`, `databases`, `modules` importables
testpaths = ["tests"]
addopts = "-ra -q -s"
