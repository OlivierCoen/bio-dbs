[project]
name = "bio-dbs"
version = "0.1.0"
description = "Bioinformatics database mirror: Django + Celery"
requires-python = ">=3.14.9"
dependencies = [
    "django==6.0.9",
    "celery[redis]==5.6.3",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "redis==6.4.0",
    "gunicorn==26.2.0",
    "psycopg2-binary==2.9.13",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4",
]
